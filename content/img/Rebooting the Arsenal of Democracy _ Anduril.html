_type":"span","marks":[],"text":"We need a new breed of defense technology companies to reboot the arsenal of democracy."}],"markDefs":[],"style":"normal"}],"slug":{"_type":"slug","current":"rebooting-the-arsenal-of-democracy"},"title":"Rebooting the Arsenal of Democracy"},{"_key":"fe867e2f388d","_type":"chapterHeaderOne","backgroundColor":{"_createdAt":"2025-03-28T19:56:03Z","_id":"88cee65f-1aea-4957-b631-663ee79c7d27","_rev":"dKXh8GgHayCRnpNDz37gy4","_system":{"base":{"id":"88cee65f-1aea-4957-b631-663ee79c7d27","rev":"x8r7rwnZNJLuzU8uziaUD1"}},"_type":"color","_updatedAt":"2025-11-20T22:47:52Z","contrastColor":"#010101","hex":"#BDAD96","metadata":null,"name":"Tan"},"currentSection":1,"deepLinkTitle":"Intro","imageCaption":"It is time to recapture the spirit of innovation","slug":{"_type":"slug","current":"intro"},"thumbnailImage":{"_type":"imageWithMeta","asset":{"_id":"image-be7e1af9b9aa95a949829e3ba36aca5a7f450197-4096x2858-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.4331700489853043,"height":2858,"width":4096},"hasAlpha":false,"isOpaque":true}}},"title":"Intro","topCaption":"Rebooting the Arsenal of Democracy","totalSections":7},{"_key":"bb812bab0ea4c8016ebd7f4aa69d7d9e","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"54fdaf006f4d","_type":"textContentSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"text":"Introduction","width":"100"},{"_key":"a09667be7d207ad4286316f9c9eed582","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"b0ba55aa9cd5","_type":"oneColumnRichText","arsenalPadding":false,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"d2c62c993d11","_type":"block","children":[{"_key":"513790a8932a","_type":"span","text":"If you have followed world events for the last decade, you have felt something changing. The 20th century is well behind us, and with it the sense that America and its allied democracies are the undisputed leaders of the world. World War II – the last major war that America and its allies can truly be said to have won – feels awfully long ago.\n\nThe most glaring herald of our decline is in our military’s technology. Once upon a time, the armed services of the United States, United Kingdom, and their partners across the world were envied for their science fiction technology. Today, they are equipped with tools decades behind what you or I use every day. Software has, to paraphrase Marc Andreessen, tried to eat the world, but with the battlefield it found a meal too ungainly to digest.\n\nDespite spending more money than ever on defense, our military technology stays the same. There is more AI in a Tesla than in any U.S. military vehicle; better computer vision in your Snapchat app than in any system the Department of Defense owns; and, until 2019, the United States’ nuclear arsenal operated off floppy disks.\n\nThe absence of a crisis made us complacent. In the aftermath of the Cold War, America and its allies felt invincible. Former Soviet states appeared to be liberalizing. China’s economy was growing, and most modernization theorists believed that the Chinese Communist Party would move inexorably toward open democracy. It was the end of history – the triumph of Western ideals and a new age of American-led world order.\n\nUntil it wasn’t. Instead of acquiescing, our competitors seized the moment. China and Russia spent two decades harnessing our most powerful weapon – innovation – and built advanced weapon systems designed to neutralize and surpass our own. The results are sobering: today, in almost every wargame the United States Department of Defense models against China, China wins.\n\nAll too quickly, we have reached the point where, in the words of General C.Q. Brown, “We must accelerate change, or lose.”"}],"style":"normal"}],"fullBleed":false,"paragraphWidth":"w-40"},{"_key":"492837b41040","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"ac35cbb0b01a","_type":"oneColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"952d3f9dbf5d","_type":"mediaCaptionBlock","column1":[{"_key":"bc52759f6444","_type":"block","children":[{"_key":"1de5a6d4e818","_type":"span","text":"[FIG.2]"}],"style":"detailElios"},{"_key":"e1b5535952d9","_type":"block","children":[{"_key":"5cc0f2b45735","_type":"span","text":"SHAEF-LONDON, 1944"}],"style":"normal"}],"column2":[{"_key":"864874ef2e8e","_type":"block","children":[{"_key":"08681950dce5","_type":"span","text":"GEN. EISHENHOWER AND HIS SENIOR COMMANDERS"}],"style":"normal"},{"_key":"1ffe395dd29c","_type":"block","children":[{"_key":"8a7cbb54fab5","_type":"span","text":"SUPREME COMMAND.\nALLIED EXPEDITIONARY FORCE"}],"style":"normal"}],"column3":[{"_key":"bd80f2830b4c","_type":"block","children":[{"_key":"0a5d16e085c0","_type":"span","text":"IMAGE:"}],"style":"detailElios"},{"_key":"5255dc2ca565","_type":"block","children":[{"_key":"452cf72ebdbe","_type":"span","text":"@ IWM TR 1541"}],"style":"normal"}],"media":[{"_key":"05fe3d74a149","_type":"imageWithMeta","asset":{"_id":"image-1741066cb23d838ebb1e94febf1d192c1eb29a93-1295x720-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.7986111111111112,"height":720,"width":1295},"hasAlpha":true,"isOpaque":true}}}]}],"fullBleed":true,"paragraphWidth":"w-100"},{"_key":"5b8cfd7d0441a4b7786891bbdc385216","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"1bc4c53e8ff7","_type":"oneColumnRichText","arsenalPadding":false,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"0aeeb39d6d74","_type":"block","children":[{"_key":"c7f2d172fa81","_type":"span","text":"There is a better way. Throughout World War II and the decades that followed, the West attracted the world’s most brilliant scientists and engineers, many of whom made foundational contributions to national defense. John von Neumann, Alan Turing, Kelly Johnson, the Jasons, and other gifted patriots recognized that our prosperity is only as strong as our means to defend it. Their technological innovations didn’t just bolster our military – many of their advances percolated into the consumer market. War research and development turned futuristic dreams into household staples: personal computing, GPS, the Internet, commercial air travel, and so much more.\n\nIt is time to recapture that spirit of innovation and bring cutting-edge technology to our armed forces again. War in Eastern Europe, the looming threat of a Taiwan invasion, and a rising tide of security threats in other regions of the world demand it. This is not a matter of minor reform. It will require a major re-evaluation of what kinds of technology we build, how we build it, and the speed at which we move.\n\nWhy can’t the existing defense companies simply do better? The largest defense contractors are staffed with patriots who nevertheless do not have the software expertise or business model to build the technology we need. Tomorrow’s weapons – autonomous systems, cyberweapons and defenses, networked systems, and more – are enabled through software, while these companies specialize in hardware. These companies work slowly, while the best engineers relish working at speed. And the software engineering talent who can build faster than our adversaries resides in the commercial sector, not at large defense primes. These companies built the tools that kept us safe in the past, but they are not the future of our defense.\n\nWe at Anduril are building defense technology in a new way, but we are just one company. If the allied democracies are to break free from the morass of bureaucracy, embedded habits, and mediocre technology that have failed our men and women in uniform for decades, we will need action at scale. Not just a handful, but dozens of new, innovative companies will be required to modernize our military. Tens of thousands of engineers will have to ask themselves if there is more to their careers than money alone. And our officials in government, without whom this effort will be for naught, will have to listen and to lead.\n\nSome observers have suggested that young engineers do not wish to work on national security. We disagree – Silicon Valley was founded by patriots pushing science and engineering forward in the national interest and is filled with people eager to do the same again today. Others claim that it is impossible to compete with the defense giants. But the government has enthusiastically embraced nontraditional companies that get results like SpaceX and Palantir. And finally, we reject the claim that democratic leadership is in inexorable decline, as our adversaries hope it to be. With the right technology, the right ways of building, and the right partners in the armed forces, we can build the systems that will safeguard the allied democracies for the next century and beyond."}],"style":"normal"}],"fullBleed":false,"paragraphWidth":"w-40"},{"_key":"1dc8a957257e678cf84a3c20b392a15a","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"0c37f588216f","_type":"chapterHeaderTwo","backgroundColor":{"_createdAt":"2025-03-28T19:47:50Z","_id":"0970ba10-788c-4613-b319-39009fd75a2a","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"0970ba10-788c-4613-b319-39009fd75a2a","rev":"g3LktQjILKhofqwxYxP0ke"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#FFFFFF","hex":"#010101","metadata":null,"name":"Black"},"backgroundImage":{"_type":"imageWithMeta","asset":{"_id":"image-9facb26b435355f947a8a4521158dd851d13a954-1440x836-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.722488038277512,"height":836,"width":1440},"hasAlpha":true,"isOpaque":true}}},"currentSection":2,"deepLinkTitle":"How Did We Get Here","slug":{"_type":"slug","current":"how-did-we-get-here"},"title":"How Did We Get Here?","topCaption":"Rebooting the Arsenal of Democracy","totalSections":7},{"_key":"327b533bafc830c35698cedec27621fd","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"5392d8769133","_type":"textContentSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"text":"How Did We Get Here?","width":"60"},{"_key":"6ad783536a02ae4ddfaedbfe475ce442","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"1d4f852a640c","_type":"spiralGraphSlice","altText":"Spiral graph"},{"_key":"8137bab1452c20d9ac8f046ee8e24df9","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"00958e52782a","_type":"twoColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"column1":[{"_key":"baf65635e7cc","_type":"animatedCharts","chartType":"fighter-jet-trend"}],"column2":[{"_key":"5580500c7bc7","_type":"block","children":[{"_key":"534c8fbf9f02","_type":"span","text":"In his eponymous memoir about the group, former Lockheed Skunk Works director Ben Rich tells two stories. One, for which he is best remembered, is a tale of aspiration and ingenuity. Alongside his iconoclastic predecessor, Kelly Johnson, Rich and his team of “skunks” designed and built vehicles that changed how the United States waged war and gathered intelligence: the U-2 spy plane, the SR-71 Blackbird, and the F-117 Nighthawk. Lockheed’s incredible record of innovation in the national interest is defense industry mythology; Rich’s memoir is practically mandated reading for patriotic engineers.\n\nThe second story Rich tells, however, is less optimistic. Writing in 1994, Rich warns of a creeping decline among the major defense companies. “In my forty years at Lockheed,” he wrote, “I worked on twenty-seven different airplanes. Today’s young engineer will be lucky to build even one.” Not only were new things rarely being built, Rich observed, but the costs of even trying to do so had skyrocketed. “The development costs of fighters have increased by a factor of 100 since the 1950s, and unit procurement costs have risen 11 percent every year since 1963,” Rich despaired. “Small wonder, then, that there were only seven new airplanes in the 1980s, compared to forty-nine in the 1950s.”\n\nRich’s first story is history; his second is yet to conclude. The United States has not fielded a new bomber plane since the end of the Cold War. The F-35, one of the few new major systems the military is fielding, has become a byword for extravagance, currently estimated to cost taxpayers $1.6 trillion. And instead of attracting new entrants to fill the gaps, the Pentagon lost a staggering 20,500 suppliers from 2000 to 2018."}],"style":"normal"}],"columnRatio":"ratio-6-6","mobileSpacing":"xl"},{"_key":"854b8727d79c762c8c8c4e80e8087400","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"0c316b5216d9","_type":"oneColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"64c6f413c454","_type":"mediaCaptionBlock","column1":[{"_key":"1c2db0f541c4","_type":"block","children":[{"_key":"359e8578fa3e","_type":"span","text":"[FIG.3]"}],"style":"detailElios"},{"_key":"fbc923a01be7","_type":"block","children":[{"_key":"913212f9422d","_type":"span","text":"SR-71 CREW"}],"style":"normal"}],"column2":[{"_key":"c5f542973429","_type":"block","children":[{"_key":"17257b197c6c","_type":"span","text":"skunk works\n+ nasa testing event 1991"}],"style":"normal"}],"media":[{"_key":"23f48dc0ffbe","_type":"imageWithMeta","asset":{"_id":"image-de1566adaf2a183ae52d099c4821a690ab013c41-1295x720-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.7986111111111112,"height":720,"width":1295},"hasAlpha":true,"isOpaque":true}}}]}],"fullBleed":false,"paragraphWidth":"w-100"},{"_key":"5bd3c2856ff1b42c08f8dda8f9ff5934","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"2c9af083ee91","_type":"twoColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"column2":[{"_key":"8d885ed4645e","_type":"block","children":[{"_key":"a0fe7803b607","_type":"span","text":"When former Lockheed CEO Norm Augustine wrote that “In the year 2054, the entire defense budget will purchase just one aircraft,” he was joking – but not by much.\n\nHow did we get here? Understanding our present circumstances means understanding the history the led us here. We do not have to delve far into the past – World War II and the years immediately following were a golden age of military innovation."}],"style":"normal"}],"columnRatio":"ratio-6-6"},{"_key":"dfcbb899b0d3","_type":"quoteSlice","author":"Neil Sheehan, A Fiery Peace in a Cold War","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"text":"It was the civilian scientists, not the military engineers, who had been the technological innovators during the war. ‘They are the ones who made the breakthroughs,’ [General Arnold] said. He predicted that those breakthroughs—in radar, in jet propulsion, in rocketry, in nuclear weapons—would prove to be the catalysts for further innovation that would radically alter the nature of war. The First World War had been decided by brawn, he said, the Second by logistics. ‘The Third World War will be different. It will be won by brains.’"},{"_key":"f8d9284edd44","_type":"twoColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"column1":[{"_key":"84f083ae1ebf","_type":"mediaCaptionBlock","column1":[{"_key":"4a9213a0c1ec","_type":"block","children":[{"_key":"18ae4ec85ade","_type":"span","text":"[FIG.4]"}],"style":"detailElios"},{"_key":"9d4463a16393","_type":"block","children":[{"_key":"74d613f2391e","_type":"span","text":"PENTAGON"}],"style":"normal"}],"column2":[{"_key":"02e20e08c5de","_type":"block","children":[{"_key":"86826c388f90","_type":"span","text":"OPERATING LIKE A STARTUP\nBUILD TIME: 16 MONTHS\n1943"}],"style":"normal"}],"media":[{"_key":"56ce9e46a6a5","_type":"imageWithMeta","asset":{"_id":"image-f2fe6cbedee93f6efb2050a591e38dea7656bdda-638x578-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.1038062283737025,"height":578,"width":638},"hasAlpha":true,"isOpaque":true}}}]}],"column2":[{"_key":"aa299bdcd775","_type":"block","children":[{"_key":"93a57fc3c910","_type":"span","text":"It can be difficult to imagine the Department of Defense, which today employs nearly 3 million Americans, moving quickly. But last century, it innovated at a speed that puts modern Silicon Valley startups to shame: the Pentagon was built in only 16 months (1941-1943), the Manhattan Project ran for just over 3 years (1942-1946), and the Apollo Program put a man on the moon in under a decade (1961-1969). In the 1950s alone, the United States built five generations of fighter jets, three generations of manned bombers, two classes of aircraft carriers, submarine-launched ballistic missiles, and nuclear-powered attack submarines.\n\nPerhaps it should not surprise us that the government worked at the pace of a Silicon Valley startup, given that World War II and Cold War military research and development kickstarted Silicon Valley in the first place. Fred Terman, the “father of Silicon Valley,” had left Stanford in World War II to run the Harvard Radio Research Laboratory, the Department of Defense’s premiere electronic warfare lab. When he returned to Stanford after the war, he brought a wealth of government connections and influence with him. By 1947, the DoD provided half of Stanford School of Engineering’s budget. Federal government spending on science and engineering, much of it concentrated in Silicon Valley, continued to balloon – in 1960, the DoD accounted for 36% of all research and development in the world.\n\nThe DoD’s investments didn’t just benefit the military, though. Decades of military research sowed the seeds of prosperity in the consumer and enterprise sectors. The French media mogul and politician Jean-Jacques Servan-Schreiber, writing in 1967, marveled at the United States’ pace of innovation, predicting that “In thirty years America will be a post-industrial society… There will be only four work days a week of seven hours per day.”\n\nThe commercial sector continued to advance – perhaps not as quickly as Servan-Schreiber imagined, but quickly enough for America to remain the most innovative country in the world. But, starting in the 1960s and intensifying through the 70s and 80s, the pace of military innovation began to slow, while costs grew. In 1955, it had become clear that the pace of defense spending was unsustainable: the federal government was spending more on defense than everything else combined. Congress knew something had to change. Robert S. McNamara, a wunderkind World War II veteran with a sterling reputation for administrative efficiency at Ford Motor Company, was the man for the job."}],"style":"normal"}],"columnRatio":"ratio-6-6","mobileSpacing":"xl"},{"_key":"88bc787ca87a2597c783ca8219cfe8d7","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"ec2e00050608","_type":"oneColumnRichText","arsenalPadding":false,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"f8147e87b57d","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_id":"image-ac4ab02c7a27d32d88eaee85201d5fce0ac09ee0-1440x880-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.6363636363636365,"height":880,"width":1440},"hasAlpha":true,"isOpaque":true}}},"imageWidth":"100","style":"center"}],"fullBleed":true,"paragraphWidth":"w-100"},{"_key":"0f2a54139162b6ad1389c3443eca026e","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"8ece36a7b695","_type":"twoColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"column1":[{"_key":"234b4c00f9d9","_type":"mediaCaptionBlock","column1":[{"_key":"3b023cb2fb27","_type":"block","children":[{"_key":"4ee6a1a6108d","_type":"span","text":"[FIG.5]"}],"style":"detailElios"},{"_key":"5b1fb13e4562","_type":"block","children":[{"_key":"03c529e7e951","_type":"span","text":"DOD BRIEF, 1962"}],"style":"normal"}],"column2":[{"_key":"b1d4c1f1446c","_type":"block","children":[{"_key":"c2eba07ea8a8","_type":"span","text":"PRESIDENT KENNEDY\nWITH ROBERT MCNAMARA\nPENTAGON"}],"style":"normal"}],"media":[{"_key":"71aaf27413c0","_type":"imageWithMeta","asset":{"_id":"image-8eef10b60175f6fbb043d62c9005b84304cf1fa9-638x578-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.1038062283737025,"height":578,"width":638},"hasAlpha":true,"isOpaque":true}}}]},{"_key":"da7aa4c435cd","_type":"block","children":[{"_key":"e957a85705b5","_type":"span","text":""}],"style":"normal"}],"column2":[{"_key":"bf18b9b60de1","_type":"block","children":[{"_key":"c0810e0dfea5","_type":"span","text":"In the early 1960s, under the direction of then Secretary of Defense McNamara, the Department of Defense instituted a labyrinth of new rules for acquiring military systems. McNamara was not merely reducing spending: his experience at Ford led him to believe that wholesale reform was needed to reshape how the government bought technology. He revamped acquisitions to emphasize efficiency, the elimination of waste, and predictability. The Planning, Programming, and Budgeting System (PPBS, later changed to PPBE for “Execution”) process that he implemented is arguably the single most influential defense reform ever enacted, indelibly altering the incentives and business models of the major defense contractors.\n\nCompetition with the Soviet Union shaped McNamara’s actions – but perhaps not as modern observers would expect. Whereas today senior DoD leaders have rightly sounded the alarm on China’s ability to compete technologically with the West, McNamara did not believe the Soviet Union capable of out-innovating the United States. In the account of Brigadier General James M. Roherty, McNamara viewed the competition against the Soviet Union in terms of “quantifiables,” believing that “a relative stability characterized weapons technology in the 1960s… that ‘technological surprise’ [was] not a threat to national security and that major breakthroughs [were] not to be expected.”\n\nThe primary focus of McNamara’s reforms was hence not innovation but cost control. He believed that, by and large, the United States already had the technology it needed to win the Cold War, and that the only problem was making sure that we didn’t spend ourselves into oblivion. The headline-grabbing arms races against the Soviet Union – the “missile gap,” the “bomber gap” – reflected differences in quantity, not quality, of military systems.\n\nMcNamara’s reforms were not wrong: they were built for a specific era with specific characteristics. Those characteristics included the federal government conducting the vast majority of research and development, rather than private companies; the overwhelming importance of large, capital-intensive, “exquisite” military systems like tanks and battleships; a predictability in the adversary’s (the Soviet Union’s) rate of technological progress; and the existence of relatively few companies able to muster the capital and expertise to build military technology.\n\nAll of those things have, to varying degrees, changed, but our system for buying technology has not. As a result, the large defense companies have learned to operate in highly idiosyncratic ways, unlike major companies in any other industry:"}],"style":"normal"}],"columnRatio":"ratio-6-6","mobileSpacing":"xl"},{"_key":"bad4ab9e07a2","_type":"mediaAccordionSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"items":[{"_key":"88a0591f9962","_type":"mediaAccordionItem","description":[{"_key":"9f25787a926b","_type":"block","children":[{"_key":"30cebfec99a2","_type":"span","text":"Under the PPBS system, before the government even considers purchasing a new military system, it embarks upon a years-long process of defining requirements, deciding where and how to allocate resources, and finally releasing an award for a new system. It is extremely difficult for the Department of Defense to rapidly acquire new technology, and as a result defense companies face no pressure to develop new systems quickly. Technology developed in the commercial sector hence takes years or decades to end up on the battlefield, if it does at all."}],"style":"normal"}],"title":"Adherence to a lengthy bureaucratic process."},{"_key":"92119003ae83","_type":"mediaAccordionItem","description":[{"_key":"945d78551364","_type":"block","children":[{"_key":"68f4d757872a","_type":"span","text":"Reflecting the prevailing belief that industry was required to execute, not innovate, to beat the Soviet Union, the requirements for major military programs are spelled out in extensive detail. Unlike most industries, which are driven forward by the creativity of the most successful companies, defense contractors are rarely asked to find creative ways to solve problems, and are sometimes punished for doing so."}],"style":"normal"}],"title":"Working off onerous system specifications. "},{"_key":"d69dfedbe10f","_type":"mediaAccordionItem","description":[{"_key":"b9c09a81bb8b","_type":"block","children":[{"_key":"cfb970e41916","_type":"span","text":"Because McNamara’s reforms made it exceptionally difficult to buy new technology quickly or to buy technology for which there is no defined requirement, defense companies rarely develop products of their own accord. Typically, they sell existing systems (which was most of their business under McNamara) or they wait for the government to order specific R&D efforts, for which they are directly compensated. For a comparison, the largest technology companies today – whose revenues vastly exceed those of the largest defense companies – spend roughly 10-20% of their revenue on research and development. Newer or mid-sized technology startups might spend closer to 60% or 70%. The major defense companies spend 1-4%."}],"style":"normal"}],"fullBleedDescription":[{"_key":"0a7a8fd9f24e","_type":"animatedCharts","chartType":"industry-trend"}],"title":"Spending little on internal research and development."},{"_key":"b506418e7516","_type":"mediaAccordionItem","description":[{"_key":"8b3d1d39b77d","_type":"block","children":[{"_key":"e3d6c5fb9137","_type":"span","marks":[],"text":"McNamara believed duplicative programs to be at the root of DoD waste and would not tolerate government spending on multiple development efforts for similar new systems, whether between military services or among different vendors. This means that once a company is awarded a major contract, it is extremely difficult to take it from them. The incentive for large defense firms is hence to spend heavily on teams of lawyers and lobbyists to shape program requirements in line with the company’s existing technology. This political battle becomes just as important as building the product itself. These lobbyists are often former military officials: By 1969, over 2,000 military officers per year were leaving the DoD to work for a major defense contractor, three times as many as in 1959."}],"markDefs":[],"style":"normal"},{"_key":"3ab709db93b1","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_id":"image-35b90295ae3e990f853123be37ec87ce345c4fcc-640x658-svg","_type":"sanity.imageAsset","mimeType":"image/svg+xml","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":0.9726443768996961,"height":658,"width":640},"hasAlpha":true,"isOpaque":false}},"crop":{"_type":"sanity.imageCrop","bottom":0,"left":0,"right":0,"top":0},"hotspot":{"_type":"sanity.imageHotspot","height":1,"width":1,"x":0.5,"y":0.5}},"imageWidth":"100","style":"left"},{"_key":"e3da2238f892","_type":"block","children":[{"_key":"6961fcd862c2","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"}],"title":"Prioritizing proposals over performance."},{"_key":"b775adffd876","_type":"mediaAccordionItem","description":[{"_key":"391ac3e9c7e6","_type":"block","children":[{"_key":"056f35b73de8","_type":"span","marks":[],"text":"In most industries, a company that fails to produce a functional product goes out of business. In the defense industry, when a company is three, five, ten years into a program and has failed to build what they promised, the government is stuck between a rock and a hard place – do they cancel the contract and throw away years of development, potentially bankrupting the vendor in the process? Or do they begrudgingly provide the vendor with even more money to salvage the program? Typically, it’s the latter. In the words of the infamous city planner Robert Moses, “Once you sink that first stake, they’ll never make you pull it up.” This may simply be a poor decision (sunk cost fallacy), but sometimes it is part of a deliberate policy to preserve the “defense industrial base” – a critical mass of defense companies that can be called upon in an emergency. There is value to this policy, but it has significant costs. It creates moral hazard for major defense companies, which effectively become “too important to fail,” and ensures that not all contracts are given out meritocratically, blunting companies’ incentives to produce better products."}],"markDefs":[],"style":"normal"}],"title":"Tolerating prolonged failure."}]},{"_key":"5a74c1a774f9","_type":"oneColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"5297c16b69aa","_type":"mediaCaptionBlock","column1":[{"_key":"490010cca92f","_type":"block","children":[{"_key":"cba14353d823","_type":"span","text":"[FIG.6]"}],"style":"detailElios"},{"_key":"ea0be8e06af9","_type":"block","children":[{"_key":"db24c4d932ec","_type":"span","text":"WASHINGTON DC"}],"style":"normal"}],"column2":[{"_key":"02efec17be74","_type":"block","children":[{"_key":"44cbc8671a11","_type":"span","text":"AN EXAMPLE OF A U.S. SENATE COMMITTEE HEARING ROOM\n\nU.S. CAPITOL BUILDING 2017"}],"style":"normal"}],"media":[{"_key":"016f4e4ab84c","_type":"imageWithMeta","asset":{"_id":"image-6fa04bfb727548544804316a5f7404fc96a032be-1295x721-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.796116504854369,"height":721,"width":1295},"hasAlpha":true,"isOpaque":false}}}]}],"fullBleed":false,"paragraphWidth":"w-100"},{"_key":"deba45c859ee","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"4258939e4b65","_type":"oneColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"adebc7a3b4f8","_type":"block","children":[{"_key":"bca26a9cd5a6","_type":"span","text":"To reiterate, there were highly logical rationales for each of these rules and norms. Some of McNamara’s beliefs turned out to be wrong, but others were vindicated – the West won the Cold War, after all. One thing McNamara’s DoD got emphatically right was reducing the use of cost-plus-fixed-fee (CPFF) contracts from 38% of contracts awarded to just over nine percent (though by 2020 they had crept back up to comprise 38% of DoD’s contracts once again). Cost-plus contracts pay vendors for the costs of developing and producing new systems, plus a percentage fee on top (typically 6-8%). This means that working quickly and efficiently often conflicts with contractors’ profit motives. In the words of Lt. Gen. James Stansberry, “Unless changes are made in the current profit system that demands higher costs as a prerequisite for higher profits, it is futile to expect lower costs… there is little economic motivation for contractors to reduce direct or indirect costs.”\n\nUltimately, however, McNamara’s system was a bet that the United States could predict the future – that they had a good idea of how Soviet technological development would progress and that, with careful planning, the United States could remain ahead. That is simply no longer true. Our adversaries innovate incredibly quickly, partially because they have learned from the mistakes of the Soviets, partially because they have become incredibly adept at industrial espionage, and partially because software, unlike hardware, can be built and improved upon incredibly quickly (more on this below).\n\nSix decades after they were first introduced, the rules for doing business with the Pentagon remain, in the words of former Defense Secretary Donald Rumsfeld, “one of the world’s last bastions of central planning.” The primary aim of these rules – to keep costs in check – was a failure: in 1969, Robert Benson, an analyst in the Office of the Secretary of Defense, testified that “about 90% of major weapon systems that the Defense Department procures end up costing at least twice as much as was originally estimated.” The incentives these rules created for defense companies have ossified into these companies’ very ways of being. It is not malice or incompetence that prevents the large defense companies from innovating, or moving quickly, or investing in internal research and development – it is simply a rational response to the incentives with which they are presented."}],"style":"normal"}],"fullBleed":true,"paragraphWidth":"w-40"},{"_key":"4e8d6e16cc76408b8f97674619c145b0","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"b127cf2b1c5f","_type":"chapterHeaderTwo","backgroundColor":{"_createdAt":"2025-03-28T19:59:10Z","_id":"06a5beb4-22c7-4d8c-97f1-2776c1f020e8","_rev":"s4FbY1rNJZOqUnJhlMyiRj","_type":"color","_updatedAt":"2025-06-18T01:02:36Z","contrastColor":"#010101","hex":"#8E9291","metadata":null,"name":"Mid Gray"},"currentSection":3,"deepLinkTitle":"The Defense Industry Today","slug":{"_type":"slug","current":"the-defense-industry-today"},"title":"The Defense Industry Today","topCaption":"Defense is an ageing, top-heavy industry that moves slowly because nobody is chasing it.","totalSections":7},{"_key":"02f2f687100341f4160d6f674c7f64c3","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"67ce3534ea61","_type":"textContentSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"text":"The Defense Industry Today","width":"80"},{"_key":"9da914d318cdfec09f35f664557983ea","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"84b7f12a19fc","_type":"twoColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"column1":[{"_key":"cc2dafd944b0","_type":"animatedCharts","chartType":"defense-industry-market"}],"column2":[{"_key":"49e2e9edff44","_type":"block","children":[{"_key":"ed082f94fa51","_type":"span","text":"One remarkable statistic tells a damning story about the modern defense sector: since 1963, the defense industry has never suffered a negative ten-year period.\n\nIs this because defense companies have built an unprecedented succession of valuable products? Far from it. On a long enough time horizon, defense companies are simply not punished for failure (and, indeed, the horizon is not all that long). Individual companies may receive a slap on the wrist for particularly egregious missteps, but by and large the government accepts that, frustrating as it may be, slow timelines, minimal innovation, and swelling costs are “the way things are.”\n\nPart of the reason that the large defense companies keep getting away with underperformance is that they face little competition. In 1993, the Cold War fading into memory, then Deputy Secretary of Defense Bill Perry sat down with the CEOs of the major defense firms at what came to be known as “the last supper.” Perry warned them that substantial cuts to the defense budget were coming and that many of their companies would not be able to survive. Put simply, he said, “We expect defense companies to go out of business. We will stand by and watch it happen.” This precipitated a flurry of mergers and acquisitions.\n\nPerry attempted to counterbalance the impact of consolidation by lowering the barriers to entry into the defense industry. He discouraged the use of onerous military specifications (“milspecs”) for new systems except as a “last resort” and championed 1994’s Federal Acquisitions Streamlining Act (FASA), which mandated the use of commercial, off-the-shelf alternatives over bespoke new technology. He also encouraged program managers in the DoD to “take more risks” and bet on new technology and new companies. Many of these changes, however, were not enforced. Both SpaceX and Palantir were forced to sue their largest customers for a failure to adhere to Perry’s rules, while a RAND corporation study from the early 2000s found that program managers had neither the incentives nor capacity to make meaningful bets on new companies and technology.\n\nThe result is an ageing, top-heavy industry that moves slowly because nobody is chasing it. The ten largest defense companies, all of which were founded decades ago, account for upwards of 80% of the industry’s revenue. Nearly two thirds of major weapons systems contracts in the United States have just one bidder. Shareholders buy defense stocks for their stability, their predictability. These companies move slowly and break as little as possible.\n\nMost engineers, understandably, do not wish to work on national security under these conditions. Engineers want to see their code deployed, their robots in motion, their products out in the world making an impact. Working slowly on antiquated technology that may never be deployed is far from an engineer’s dream. And so the companies once staffed with some of the greatest engineering minds in the Western world now struggle to attract graduates from top engineering programs.\n"}],"style":"normal"}],"columnRatio":"ratio-6-6","mobileSpacing":"xl"},{"_key":"1280b20341d8","_type":"oneColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:58:16Z","_id":"93236b56-c0b1-425a-b437-fe506a403f5e","_rev":"AvL2O0NKDscm5FGHyg7i2R","_system":{"base":{"id":"93236b56-c0b1-425a-b437-fe506a403f5e","rev":"Rmu8w9WmfRS5MFvcURmmiB"}},"_type":"color","_updatedAt":"2025-10-23T21:43:59Z","contrastColor":"#010101","hex":"#F1F0EA","metadata":null,"name":"Sand"},"content":[{"_key":"0ac554fb74c0","_type":"animatedCharts","chartType":"drag-branch-chart"},{"_key":"98c9336a4ac5","_type":"block","children":[{"_key":"20ef3cea2b65","_type":"span","text":""}],"style":"normal"}],"fullBleed":true,"paragraphWidth":"w-100"},{"_key":"7daaadd6f0e210f89eeabc336c688c0b","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:58:16Z","_id":"93236b56-c0b1-425a-b437-fe506a403f5e","_rev":"AvL2O0NKDscm5FGHyg7i2R","_system":{"base":{"id":"93236b56-c0b1-425a-b437-fe506a403f5e","rev":"Rmu8w9WmfRS5MFvcURmmiB"}},"_type":"color","_updatedAt":"2025-10-23T21:43:59Z","contrastColor":"#010101","hex":"#F1F0EA","metadata":null,"name":"Sand"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"bca7b6d44f84","_type":"chapterHeaderTwo","backgroundColor":{"_createdAt":"2025-03-28T19:47:50Z","_id":"0970ba10-788c-4613-b319-39009fd75a2a","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"0970ba10-788c-4613-b319-39009fd75a2a","rev":"g3LktQjILKhofqwxYxP0ke"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#FFFFFF","hex":"#010101","metadata":null,"name":"Black"},"backgroundImage":{"_type":"imageWithMeta","asset":{"_id":"image-72620f56390ed519511d03338ce792101e1c6eca-4096x2160-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.8962962962962964,"height":2160,"width":4096},"hasAlpha":false,"isOpaque":true}}},"currentSection":4,"deepLinkTitle":"The Rise of Software","slug":{"_type":"slug","current":"the-rise-of-software"},"title":"The Rise of Software","topCaption":"Software will change how war is waged","totalSections":7},{"_key":"aa651d0110633bfb4a21e7c2973a488d","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"66d022294d15","_type":"textContentSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"text":"The Rise of Software","width":"80"},{"_key":"f24450f7b69627a6bc5fdd5dd93118bc","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"3638bfedd4b4","_type":"oneColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"79d17ac0aa50","_type":"block","children":[{"_key":"fe54bce43a3b","_type":"span","text":"The Department of Defense used to own all the technology it needed to credibly deter and, if necessary, win the next great war. But the same is not true today.\n\nThis isn’t because our ships aren’t big enough, or our planes fast enough, or our tanks sturdy enough. The areas in which the United States and its allies are falling behind are not these large hardware systems, which we employed to dominate the 20th century, but sophisticated software. The majority of the Department of Defense’s innovation priorities – including artificial intelligence, networked weapons, cybersecurity, and more – are enabled, either in part or in total, by software. The hardware components of swarming munitions, autonomous UAVs, or cruise missile defense systems are just one half of the equation. Sophisticated software is the real force behind these innovations.\n\nSoftware will change how war is waged. The battlefield of the future will teem with artificially intelligent, unmanned systems, which fight, gather reconnaissance data, and communicate at breathtaking speeds. The bipartisan congressional Future of Defense Task Force, drawing upon DARPA’s “Mosaic Warfare” concept, describe a future “where ubiquitous and affordable unmanned air and ground platforms find targets on a contested battlefield and pass the information to a decision maker who can instantly task another part of the same system to strike the enemy from safety.” The traditional division between land, air, sea, and space domains will become increasingly anachronistic, as nation states compete for total, all-domain superiority.\n\nThere is sometimes a misconception among government officials that software is easier to build than hardware, or that higher quality human capital is required to produce hardware than software. This is flatly untrue: Building the software that makes these concepts possible is an engineering task on the order of magnitude of building a fighter jet. It will require the work of the very brightest engineers in the allied democracies.\n\nSilicon Valley has a near-monopsony on this talent. Almost every single top-tier software engineer in the democratic world works at a technology company, whether at a startup or in Big Tech. John von Neumann, whose talents were so highly valued that the RAND corporation paid him to scribble down his morning thoughts while shaving, would today be working for Google or Facebook. Everything about how such companies operate has been tailored to these engineers – the creative and professional freedom, the speed and lack of bureaucracy, even the casual dress code. There is also an economic incentive for these engineers to work at technology companies, which have higher margins than most other industries and can afford to pay their top talent more."}],"style":"normal"}],"fullBleed":true,"paragraphWidth":"w-40"},{"_key":"f948d93e9299","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"e2698b435b55","_type":"oneColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"b5a14fedfb09","_type":"animatedImage","image":{"_type":"imageWithMeta","asset":{"_id":"image-f416fc5d8ce9280094257f81e62cde7fb79f8e47-1296x960-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.35,"height":960,"width":1296},"hasAlpha":true,"isOpaque":false}}},"imageType":"hello-war"},{"_key":"a5b25e0bccea","_type":"mediaCaptionBlock","column1":[{"_key":"1eaa90029c6e","_type":"block","children":[{"_key":"16b27909df40","_type":"span","text":"[FIG.7]"}],"style":"detailElios"},{"_key":"55ff16d0b13e","_type":"block","children":[{"_key":"aa0384e2da9d","_type":"span","text":"THE RISE OF SOFTWARE"}],"style":"normal"}],"column2":[{"_key":"472241e3a992","_type":"block","children":[{"_key":"db5306e4a255","_type":"span","text":"REFERENCE:"}],"style":"detailElios"},{"_key":"ce36ed463305","_type":"block","children":[{"_key":"760588f9e854","_type":"span","text":"“HELLO, WORLD!”\nPROGRAM—KERNIGHAN\n1978"}],"style":"normal"}],"column3":[{"_key":"cb16576bddf9","_type":"block","children":[{"_key":"feb2b5df85c1","_type":"span","text":"IMAGE:"}],"style":"detailElios"},{"_key":"dcb630ad2329","_type":"block","children":[{"_key":"586fa7f8e33a","_type":"span","text":"@ IWM TR 1541"}],"style":"normal"}]},{"_key":"83059defac02","_type":"block","children":[{"_key":"0895acb392d4","_type":"span","text":""}],"style":"normal"}],"fullBleed":true,"paragraphWidth":"w-100"},{"_key":"64b06d0aab8a","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"64f902b2eb56","_type":"oneColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"1e148ea5e2c5","_type":"block","children":[{"_key":"0ab4a684bd7b","_type":"span","text":"The most unrealistic part about James Bond’s gadgets isn’t the technology itself – it’s that the government owns it. Indeed, the companies building transformative software technology rarely work on national security at all. Sometimes, this is for cultural reasons – after employees at Google protested Google’s participation in Project Maven, the DoD’s flagship AI program, Google canceled their contract. In fairness to these employees, they didn’t sign up to work on defense, and there is no reason in a liberal democracy that one should be forced to work on things that one finds objectionable. But for those engineers who do wish to work on national security, few options present themselves. The big tech companies either avoid defense work or treat it as a secondary priority. Moreover, the defense technology they do build is rarely designed for the job; it is usually commercial software adapted to a military purpose. These companies deserve our applause for working with the government, but dual-use technology won’t be enough to maintain our technological lead.\n\nBeyond the lack of software engineering talent, the traditional defense contractors struggle to build software because it goes against the principles by which they operate. The legacy primes are used to slowly developing large, exquisite hardware systems like battleships, which sit in a factory for years before they are finally complete. Once sold, they are largely finished, besides occasional maintenance. Software is fundamentally different. It is developed by shipping a minimum viable product out the door as quickly as possible and seeing where it fails. Software companies respond rapidly and continuously to the performance of software in the field, to such an extent that deployment and iteration are parts of the development process itself. As software technology advances, developers add new features and keep a product up to date.\n\nThat is what the military systems and military companies of today should look like: more Tesla than Ford, more Apple than Nokia."}],"style":"normal"}],"fullBleed":true,"paragraphWidth":"w-40"},{"_key":"aa77d8ff1c69","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"6b44f3f8e6a8","_type":"chapterHeaderThree","backgroundColor":{"_createdAt":"2025-03-28T19:59:26Z","_id":"912f9692-6f4e-473d-9194-2c48d21b6f7b","_rev":"s4FbY1rNJZOqUnJhlMzBUR","_system":{"base":{"id":"912f9692-6f4e-473d-9194-2c48d21b6f7b","rev":"3h6Aq9HwJKloB0447GtDIQ"}},"_type":"color","_updatedAt":"2025-06-18T01:04:05Z","contrastColor":"#FFFFFF","hex":"#6C6E6B","metadata":null,"name":"Mid Dark Gray"},"currentSection":5,"deepLinkTitle":"A new model","slug":{"_type":"slug","current":"a-new-model"},"title":"A new model","totalSections":7},{"_key":"8cfe0341aed332fac489916c212b6d34","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"3169ab5b3529","_type":"textContentSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"text":"A New Model","width":"100"},{"_key":"d7e0035b74b3a8b4ccfdc37b887a07b1","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"685b63179dc3","_type":"oneColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"decb85bc8c75","_type":"block","children":[{"_key":"d47ba87d452a","_type":"span","text":"The biggest lie of the political debate surrounding defense spending is that we are stuck in a dichotomy between doing “more with more” or “less with less.” This is a false choice – technology means doing more with less. The stagnation in the defense industry is not inevitable, and we need not accept it.\n\nAnduril is one of a slew of innovative defense companies pioneering a new model, based on the following principles:"}],"style":"normal"}],"fullBleed":true,"paragraphWidth":"w-40"},{"_key":"201ccedddf84","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"11d775bdc766","_type":"oneColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"b1182bdfa47d","_type":"mediaCaptionBlock","column1":[{"_key":"0b42d203e20e","_type":"block","children":[{"_key":"7748add59251","_type":"span","text":"[FIG.8]"}],"style":"detailElios"},{"_key":"0ea7e257f585","_type":"block","children":[{"_key":"bb06a0125720","_type":"span","text":"ANDURIL SENTRY"}],"style":"normal"}],"column2":[{"_key":"2cec8415a0a9","_type":"block","children":[{"_key":"6aff49d7c46b","_type":"span","text":"AI-ENABLED COMPUTER SYSTEM\n\nAUTONOMOUSLY IDENTIFIES, DETECTS AND TRACKS THREATS"}],"style":"normal"}],"column3":[{"_key":"aacb8f5676f7","_type":"block","children":[{"_key":"15d59b021f2b","_type":"span","text":"IMAGE:"}],"style":"detailElios"},{"_key":"c33c8a30027c","_type":"block","children":[{"_key":"23df82971902","_type":"span","text":"ANDURIL INDUSTRIES"}],"style":"normal"}],"media":[{"_key":"03a0e7a222b7","_type":"imageWithMeta","asset":{"_id":"image-710256985f99cccba16068358da8aaa344e2d6e8-1296x720-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.8,"height":720,"width":1296},"hasAlpha":true,"isOpaque":false}}}]}],"fullBleed":true,"paragraphWidth":"w-100"},{"_key":"ac3f095fb69eb5c8d91d2dbfe538abd5","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"cd43811060c0","_type":"keyFeatureAccordion","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"items":[{"_key":"cc6aa0ca9e16","_type":"keyFeatureItem","content":[{"_key":"d439fac1368f","_type":"block","children":[{"_key":"4fabd5fe0683","_type":"span","text":"Security threats are evolving faster than we are. In 2018, Under Secretary for Research and Engineering Mike Griffin noted that, on average, it takes the US sixteen years to deliver an idea to operational capability, compared to under seven years for China. That kind of advantage compounds incredibly quickly: an adversary that starts out with only a fraction of our capabilities but which advances 2x faster will quickly overpower us. And it isn’t just great powers moving more quickly than we are – in the Middle East, well-financed terrorist organizations and militias iterate monthly on their armed drones. In the cyber domain, a greater number of state and nonstate actors alike have become capable of sophisticated attacks.\n\nWe need defense companies that are fast. That won’t happen simply by wishing it to be so: it will only happen if companies are incentivized to move. Thankfully, there is a readily available model for this: every single other industry on the planet. Whether they are selling cars, phones, furniture, or coffee, most companies do not get paid until they build a finished product. That can and should be the case in the defense industry, too: companies should privately finance their research and development, engineer new products quickly and efficiently, and then sell them “off the shelf” to their government partners. The government, in turn, should appropriately reward companies that take on risk and development costs for the technology they build.\n\nThere is recent and compelling precedent for this: SpaceX. Despite working on capital-intensive, highly complex products, SpaceX has poured billions of dollars of private capital into research and development. It was found by NASA’s own analysis to be three times cheaper than NASA itself. If rocket-ships can be built quickly and sold “off the shelf,” then so can many more things in the defense budget.\n\nBut the threat doesn’t stop changing once we sell a system, so nor should our technology. It beggars belief that our men and women in uniform receive updates on their smart phones whenever technology improves, but must wait years for updates to the technology that might save their lives. Software is a double-edged sword: updates can be distributed to operational theaters across the globe with the click of a button, which means that software-enabled technology can stay up to date nearly indefinitely. Conversely, if software isn’t updated frequently, it quickly becomes obsolete. The government should demand the continuous deployment of the latest and greatest software to the tactical edge."}],"style":"normal"}],"title":"Outpacing the Threat"},{"_key":"d2a2c537f00c","_type":"keyFeatureItem","content":[{"_key":"b40ee270b580","_type":"block","children":[{"_key":"ac62d0bc9461","_type":"span","text":"The defining feature of history’s most successful technology companies is product vision. Jeff Bezos, Steve Jobs, Elon Musk, and other great technology entrepreneurs all had distinct images of the future and how their products would shape it. These visions were independent of – and often directly contradicted by – the opinions of those around them. Indeed, their success can at least partially be attributed to the fact that they work on things that their customers and competition did not believe were possible or did not yet understand. Had they been building new products off painstaking specifications laid out by their customers, the history of modern technology would look very different.\n\nThe next great defense companies will also have a vision of the future: they will build to the mission, not to spec. That designing products to solve problems from first principles. Defense acquisitions have historically been dominated by an emphasis on exquisite platforms – i.e., the Navy needs a fleet with X ships, or the Air Force needs a plane with Y capabilities – rather than an emphasis on problem-solving. The defense companies are told what to build through a dense requirements process. This process answers the question of what the next battleship should look like, but never the question of whether a new battleship is needed at all.\n\nToday’s model has things backwards. The problems we are trying to solve should be top of mind, not only for the government, but for the companies building the solutions to those problems. Nobody understands the operational threats that the government is engaging with better than the government itself, but, in turn, nobody understands the technical solutions that can be brought to bear better than industry. Not every company’s product vision will ultimately meet the operational needs of their partners in government, but that is okay – most companies in a capitalist system fail. Competition will bring the best to the forefront and solve problems in ways the government had not predicted or thought possible."}],"style":"normal"}],"title":"Building to the Mission, Not to Spec"},{"_key":"7ffc57894ffa","_type":"keyFeatureItem","content":[{"_key":"ed5c91c5b1ed","_type":"block","children":[{"_key":"497f240a0674","_type":"span","marks":[],"text":"Software is finally eating the battlefield, whether the defense industry likes it or not. Whether it is AI-enabled drone swarms, networked weapons systems, real-time situational awareness generated by sensor fusion, or cyberwarfare, software is at the core of the weapon systems of the future. Building world-class software platforms is an engineering challenge akin to building a fighter jet: the next generation of defense companies will invest in doing so accordingly.\n\nPure software can radically expand the capabilities of an armed force, but it can become even more potent when integrated into hardware systems. Take unmanned aerial systems, for example. UAVs like General Atomics’ Reapers and Predators have been staples of the United States’ and United Kingdom’s arsenals for decades now, but because these vehicles are manually piloted and monitored, they require a crew of a dozen to operate. Cutting-edge artificial intelligence and autonomy can reverse that equation:\n\nThis is but one example. The broader point is that modern technology companies do not think of the sheet metal on the exterior of a system as its most valuable element: they instead build the hardware around the new capabilities that software enables. Take almost any major commercial technology from the last decade – new phones, cars, voice assistants, hobby drones: everything from sensor selection to control surfaces is optimized for software. Defense products should be no different."}],"markDefs":[],"style":"normal"},{"_key":"23e5956827c3","_type":"mediaCaptionBlock","column1":[{"_key":"69d5b9b31465","_type":"block","children":[{"_key":"b347208cd1e6","_type":"span","text":"[FIG.9]"}],"style":"detailElios"},{"_key":"ecb7968eff34","_type":"block","children":[{"_key":"91327c26fded","_type":"span","text":"IN THE FIELD"}],"style":"normal"}],"column2":[{"_key":"06bad41231d1","_type":"block","children":[{"_key":"1b3f4e7429bf","_type":"span","text":"SOFTWARE IS USED TO MAKE MISSION CRITICAL DECISIONS"}],"style":"normal"}],"media":[{"_key":"bfe44e5e0c72","_type":"imageWithMeta","asset":{"_id":"image-8ee517180996477097037a284327e12375d35ecb-639x589-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.0848896434634974,"height":589,"width":639},"hasAlpha":true,"isOpaque":false}}}]}],"title":"Software-First"},{"_key":"00d88f2e4f68","_type":"keyFeatureItem","content":[{"_key":"c2479f3cdb8b","_type":"block","children":[{"_key":"6bfe487a398d","_type":"span","text":"The defense of the nation is the pre-condition for the nation’s prosperity – but defense companies have a duty, like any entity that receives public funding, to deliver services to the government at a minimal burden to the taxpayer.\n\nThis is a particularly sensitive issue for the defense industry. Governments around the world routinely (and justifiably) complain of being bilked by major defense contractors. While there are certainly historical examples of fraud and abuse on the part of contractors, the deeper problem is structural. High costs are endemic to a defense industry that operates off cost-plus contracts.\n\nOn the other hand, the uncomfortable truth is that it is impossible to build and scale a successful business without rewarding the investors and employees who took a risk on it. If the companies challenging the incumbent defense firms are not profitable, they will get nowhere at all, and our defense technology will continue to languish behind consumer tech.\n\nThere is no magic bullet for driving down costs, but a healthy dose of free market capitalism would go a long way in getting us there. The more companies we bring into the defense industrial base, the more these companies will have to compete on price. The more that companies spend on their own dime rather than relying on cost-plus contracts, the more they’ll cut costs. And the more we leverage new technology like AI, the more we can save on labor costs for the dull, dirty, dangerous jobs of military service."}],"style":"normal"}],"title":"Controlling Defense Budgets"}]},{"_key":"1909bc698ff0ebaaddddaf34851e9f26","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xl"},{"_key":"b62df4ed04e1","_type":"chapterHeaderTwo","backgroundColor":{"_createdAt":"2025-03-28T19:47:50Z","_id":"0970ba10-788c-4613-b319-39009fd75a2a","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"0970ba10-788c-4613-b319-39009fd75a2a","rev":"g3LktQjILKhofqwxYxP0ke"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#FFFFFF","hex":"#010101","metadata":null,"name":"Black"},"backgroundImage":{"_type":"imageWithMeta","asset":{"_id":"image-0898f53b7e40c7f03fed87c8bda0ca9ec5251f2d-1920x1280-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.5,"height":1280,"width":1920},"hasAlpha":false,"isOpaque":true}}},"currentSection":6,"deepLinkTitle":"The Government Response","slug":{"_type":"slug","current":"the-government-response"},"title":"The Government Response","topCaption":"The challenge ahead is gigantic, but so are the rewards of success, continued peace and prosperity in the democratic world","totalSections":7},{"_key":"14ed9450191e80506e1fc7c59221c954","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"d2cdf8a9e77d","_type":"textContentSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"text":"The Government Response","width":"100"},{"_key":"62cfbb2b32a293251834785397390d49","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a
