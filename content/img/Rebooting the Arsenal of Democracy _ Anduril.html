5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"horizontalRule":false,"spacerHeight":"xxl"},{"_key":"db3b2d7e9547","_type":"oneColumnRichText","arsenalPadding":true,"backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"content":[{"_key":"caa577261ae3","_type":"block","children":[{"_key":"28398cbf34d5","_type":"span","text":"With the principles above, we can create an archipelago of modern, agile defense companies that turn our soldiers into superheroes. These companies will solve problems of their own accord, but also bring out the best in the incumbent defense contractors, who have not felt meaningful competition nipping at their heels in decades.\n\nBut the companies following these principles, however well-intentioned, will mostly fail without an equivalent response from our government leaders. The major defense companies operate as they do because our laws and regulations incentivize it. Governments across the democratic world have a monumental task ahead of them in reshaping the incentives of the defense industry and allowing a more dynamic, innovative model to thrive.\n\nWe have spent the last few years publishing and advocating a series of policy analyses and recommendations to modernize our antiquated weapons acquisitions system, usually tailored to the United States government but often applicable across nations. Recommendations like these are just the tip of the iceberg, and we exhort our leaders in government to develop and drive forward solutions where they see problems. A few areas we have identified where there are achievable wins include:"}],"style":"normal"}],"fullBleed":true,"paragraphWidth":"w-40"},{"_key":"47080ad89810","_type":"keyFeatureAccordion","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","rev":"7VWAhJjM6fDIh2mauhtJEa"}},"_type":"color","_updatedAt":"2026-06-04T16:31:45Z","contrastColor":"#010101","hex":"#FFFFFF","metadata":null,"name":"White"},"items":[{"_key":"e67d5adef41f","_type":"keyFeatureItem","content":[{"_key":"9c61f15f8c46","_type":"block","children":[{"_key":"88c29451c55b","_type":"span","text":"This isn’t just for companies: the government must embrace a software-first mindset too. In practice, this would involve a long series of changes, including but not limited"}],"style":"normal"},{"_key":"58422b9575d9","_type":"block","children":[{"_key":"0ad4f691553f","_type":"span","marks":["strong"],"text":"Establishing large, critical programs for key software priorities."},{"_key":"b0e351aab544","_type":"span","text":" Simply put, the government does not value software in the way that it does hardware. In the United States, fewer than 10% of the military’s Major Defense Acquisition Programs (MDAPs) are software systems. Even more damningly, the military’s largest software programs are mostly IT tools, designed for internal management and civil functions, most of which could be done better by commercially available technology. The first step toward leveraging the latest in modern technology is demanding it through big programs."}],"level":1,"listItem":"number","style":"normal"},{"_key":"1941e5158d50","_type":"block","children":[{"_key":"1fb28721057b","_type":"span","marks":["strong"],"text":"Awarding prime contracts to software companies."},{"_key":"d8740138ad9d","_type":"span","text":" Fundamental design decisions for new military systems are typically made before software companies are even consulted, meaning the hardware is not optimized for and often entirely unable to accommodate cutting-edge software."}],"level":1,"listItem":"number","style":"normal"},{"_key":"da80e6289e62","_type":"block","children":[{"_key":"22e65ce4e112","_type":"span","marks":["strong"],"text":"Aligning acquisition policy with industry best practices."},{"_key":"ff8b9e14b07c","_type":"span","text":" This would include transitioning away from RDT&E-heavy, cost-plus fixed fee contracts towards firm fixed price contracts that encourage rapid prototyping, deployment, and testing of new capabilities. To go even further, governments should experiment with industry-standard payment structures like subscriptions and “as-a-service” models, which minimize switching and sunk costs, encourage competition, and demand that technology is constantly updated."}],"level":1,"listItem":"number","style":"normal"}],"title":"Thinking Software-First."},{"_key":"15c70c8c5389","_type":"keyFeatureItem","content":[{"_key":"f564b7a4dfad","_type":"block","children":[{"_key":"d7d70c547afd","_type":"span","text":"Most government contracts are awarded on the basis of lengthy proposals, with little to no reference to real-life performance of the technology in question. To encourage the most innovative companies and engineers to work on defense technology, the government should instead:"}],"style":"normal"},{"_key":"4e5c0f77abe3","_type":"block","children":[{"_key":"53046e419f90","_type":"span","marks":["strong"],"text":"Shift from proposals-focused competition to performance-based competition. "},{"_key":"25b0f5eacf98","_type":"span","text":"Instead of prioritizing proposals, acquisitions should be structured as a series of bake-offs and well delineated projects that test a vendor’s ability to solve a problem with technology and deploy it operationally."}],"level":1,"listItem":"number","style":"normal"},{"_key":"e956f69c0aa1","_type":"block","children":[{"_key":"e90727a4c2a5","_type":"span","marks":["strong"],"text":"Always have a meaningful contract at the end of a competition, and issue it quickly."},{"_key":"bbd1d04ca527","_type":"span","text":" Innovation grants and pilot contracts only go so far – in return for investing time and money into demonstrating a new capability, companies that successfully solve government problems should be rewarded in a timely manner."}],"level":1,"listItem":"number","style":"normal"},{"_key":"6d69c7c94f6c","_type":"block","children":[{"_key":"576a0fa13982","_type":"span","marks":["strong"],"text":"Keep rewarding new winners by frequently recompeting large programs."},{"_key":"cc83c2a319f5","_type":"span","text":" Governments routinely award decade-long, multibillion dollar contracts to single vendors. This couldn’t be more different to the commercial world, where consumers are typically free to switch between vendors at little cost whatsoever."}],"level":1,"listItem":"number","style":"normal"},{"_key":"2f7ed78209be","_type":"block","children":[{"_key":"4c4a84de1070","_type":"span","marks":["strong"],"text":"Measure inputs, not outputs."},{"_key":"51fb85d58f9b","_type":"span","text":" Governments should hold themselves accountable: instead of asking how many competitions it held, it should ask itself how many of those competitions led to a meaningful contract for a nontraditional defense company."}],"level":1,"listItem":"number","style":"normal"}],"title":"Running Meritocratic Competitions for New Systems. "},{"_key":"357c6eccda72","_type":"keyFeatureItem","content":[{"_key":"61edd0c5460c","_type":"block","children":[{"_key":"3abc3a275ea2","_type":"span","text":"The government typically demands “data rights” – or technical information about how to build a given piece of technology – in a sweeping, one-size-fits-all fashion, a relic of a hardware-centric world. This, unfortunately, scares away all but a handful of modern software companies, who view giving the government their valuable source code as an existential threat to the company. A new model of data rights agreements would:"}],"style":"normal"},{"_key":"ceade0551941","_type":"block","children":[{"_key":"1a7199f51250","_type":"span","text":"Account for the size of the program in question, allowing vendors to retain greater rights for small programs and giving the government greater control for larger programs."}],"level":1,"listItem":"number","style":"normal"},{"_key":"6556ed6fdb90","_type":"block","children":[{"_key":"cdd6d2fb9b46","_type":"span","text":"Closely define the scope of the use of the software being acquired."}],"level":1,"listItem":"number","style":"normal"},{"_key":"0789f8cdfb97","_type":"block","children":[{"_key":"40355dba5df4","_type":"span","text":"Address technical lock-in by demanding adherence to technical interoperability standards such as APIs and Government-defined or industry-defined open protocols."}],"level":1,"listItem":"number","style":"normal"},{"_key":"a1ccc69c419a","_type":"block","children":[{"_key":"211a78900228","_type":"span","text":"Allow vendors to propose alternative contract structures, including as-a-service contracts."}],"level":1,"listItem":"number","style":"normal"},{"_key":"77f063f4b332","_type":"block","children":[{"_key":"5bd74fca35e0","_type":"span","text":"Weigh the costs, not just the benefits, of demanding greater data rights."}],"level":1,"listItem":"number","style":"normal"}],"title":"Revamping Anachronistic Data Rights Practices. "},{"_key":"3ac34850d36b","_type":"keyFeatureItem","content":[{"_key":"5da062b4a045","_type":"block","children":[{"_key":"044cb966a36d","_type":"span","text":"In the United States, it is easier than ever to win a small pilot or prototype contract from the government thanks to a smorgasbord of new innovation entities like the Defense Innovation Unit, AFWERX, NavalX, and more. Conversely, it has never been harder to transition to a large program of record, leaving companies languishing for years between initial funding and scaled deployments. This often sends companies bankrupt, or, more typically, dissuades companies from ever doing business with the government in the first place. This year, the United States Congress addressed this problem with an “Agile Procurement Transition Pilot,” designed to help scale new technologies quickly and get companies through the valley of death. This is a valuable start, but by no means a wholesale solution to the valley of death. Governments across the democratic world should find ways to speed up their acquisitions processes and quickly get new technology into the hands of their uniformed men and women."}],"style":"normal"}],"title":"Helping Companies Cross the “Valley of Death” By Loosening Contracting Timelines."},{"_key":"13de2ff9365c","_type":"keyFeatureItem","content":[{"_key":"e8c828d16ef8","_type":"block","children":[{"_key":"fdd214aa4d2a","_type":"span","text":"Often, the government has created programs to access and scale new innovations. Because the process to acquire new technologies is so Byzantine, however, acquisitions officers are often unaware of or under-educated about the tools at their disposal. Where possible, governments should publicize and educate acquisition and contract officers about the tools they already possess to minimize bureaucracy and access new technology.\n\nSince founding Anduril, we have been profoundly encouraged by the volume and intensity of support ideas like these have received from those in government. There is a growing group of government officials in administrations across the world who recognize that business as usual simply will not cut it anymore. The challenge ahead is gigantic, but so are the rewards of success: continued peace and prosperity in the democratic world."}],"style":"normal"}],"title":"Leverage Existing Programs."}]},{"_key":"da7f9565696ec256e54d6b1fcb13a04c","_type":"spacerSlice","backgroundColor":{"_createdAt":"2025-03-28T19:48:15Z","_id":"4ef72091-a5e5-4392-b0bb-30764a72ee0f","_rev":"UXH5eRH3LWIQEsoDKxb1Mv","_system":{"base":{"id":"4ef72091-a5e5-4392-b
